# The free Render instance sleeps after 15 idle minutes and takes 30-50 s to wake.
# This pings it every 10 minutes so the first visitor doesn't wait.
# (GitHub may run scheduled jobs late; an uptime monitor is the more reliable fix.)
name: Keep the site warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://beanstalk.eliweiss.me/healthz
