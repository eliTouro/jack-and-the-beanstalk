# Render Blueprint: Render -> New -> Blueprint -> pick this repo.
# The API key is NOT stored here: `sync: false` makes Render ask for it in the dashboard.
services:
  - type: web
    name: jack-and-the-beanstalk
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    domains:
      - beanstalk.eliweiss.me
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: IMAGE_MODEL
        value: gpt-image-1-mini
      - key: IMAGE_QUALITY
        value: medium
      - key: IMAGES_PER_HOUR
        value: "15"
